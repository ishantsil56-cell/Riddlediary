<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Riddle's Diary</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment: #e4d5b7;
            --ink-black: #1a1512;
            --gold-leaf: #af9500;
            --dark-shadow: rgba(0, 0, 0, 0.6);
            --magic-glow: 0 0 8px #af9500;
        }

        body {
            background-color: #0d0b09;
            font-family: 'Crimson Text', serif;
            color: var(--ink-black);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Magical Ambient Texture */
        .diary-page {
            background: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/pinstriped-dark.png');
            box-shadow: inset 0 0 60px var(--dark-shadow), 5px 10px 20px #000;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            min-height: 650px;
            position: relative;
            display: flex;
            flex-direction: column;
            animation: flicker 8s infinite alternate;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.96; }
        }

        /* Flashcard Style - Content Removed */
        .entry-card {
            background: #f2e8d5;
            margin: 15px 0;
            padding: 18px;
            cursor: pointer;
            position: relative;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            clip-path: polygon(0% 2%, 100% 0%, 98% 100%, 0% 98%); /* Simple torn look */
            transition: transform 0.2s;
        }
        
        .entry-card:hover {
            transform: scale(1.02);
            box-shadow: var(--magic-glow);
        }

        .quote-text {
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
            margin-top: 10px;
            color: #555;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 5px;
        }

        input, textarea {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--gold-leaf);
            font-family: inherit;
            color: var(--ink-black);
            outline: none;
            width: 100%;
            margin-bottom: 10px;
        }

        button {
            background: transparent;
            border: 1px solid var(--ink-black);
            font-family: inherit;
            cursor: pointer;
            padding: 8px 15px;
            margin: 5px 0;
            transition: 0.3s;
        }

        button:hover { background: var(--ink-black); color: var(--parchment); }

        /* Full Screen Edit Overlay */
        #edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen" class="diary-page">
        <h2 style="text-align:center; letter-spacing: 2px;">T.M. RIDDLE</h2>
        <p id="display-riddle" style="font-style: italic; text-align: center; margin-top: 50px;"></p>
        <input type="text" id="riddle-answer" placeholder="Respond to the diary..." style="text-align: center; margin-top: 30px;">
        <button onclick="checkRiddle()">Speak</button>
        <p id="auth-feedback" style="text-align:center; color: #700;"></p>
    </div>

    <div id="main-screen" class="diary-page hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0;">The Ledger</h2>
            <div style="cursor:pointer; font-size: 1.5rem;" onclick="toggleSettings(true)">&#9881;</div>
        </div>

        <div id="entry-list" style="flex-grow: 1; overflow-y: auto; margin: 20px 0;"></div>

        <div style="border-top: 1px solid rgba(0,0,0,0.1); padding-top: 10px;">
            <input type="date" id="new-date" style="width: auto;">
            <input type="text" id="new-title" placeholder="A memory title...">
            <textarea id="new-content" placeholder="Pour your soul here..." rows="2"></textarea>
            <button onclick="addEntry()" style="width: 100%;">Seal in Ink</button>
        </div>

        <div id="settings-menu" class="diary-page" style="display:none; position:absolute; top:0; left:0; height:100%; z-index:20;">
            <h3>Enchanted Settings</h3>
            <label>The Riddle:</label>
            <input type="text" id="set-riddle">
            <label>The Answer:</label>
            <input type="text" id="set-answer">
            <button onclick="saveSettings()">Apply Magic</button>
            <button onclick="toggleSettings(false)">Close</button>
        </div>
    </div>

    <div id="edit-modal">
        <div class="diary-page" style="min-height: 80vh;">
            <input type="text" id="edit-title" style="font-size: 1.5rem; font-weight: bold;">
            <input type="date" id="edit-date" style="width: auto;">
            <textarea id="edit-content" style="flex-grow: 1; border: none; margin-top: 20px;" placeholder="Writing..."></textarea>
            <div style="display:flex; gap: 10px;">
                <button onclick="updateEntry()" style="flex:1">Save Changes</button>
                <button onclick="closeEdit()" style="flex:1">Close</button>
            </div>
        </div>
    </div>

    <script>
        let entries = JSON.parse(localStorage.getItem('diary_entries')) || [];
        let config = JSON.parse(localStorage.getItem('diary_config')) || {
            riddle: "I speak without a mouth and hear without ears. What am I?",
            answer: "echo"
        };
        let currentEditIndex = null;

        const magicQuotes = [
            "The ink knows what the heart hides.",
            "Shadows lengthen where the quill rests.",
            "A secret kept is a power slept.",
            "Only the worthy may read the fading lines."
        ];

        function init() {
            document.getElementById('display-riddle').innerText = config.riddle;
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('new-date').value = today;
        }

        function checkRiddle() {
            const val = document.getElementById('riddle-answer').value.toLowerCase().trim();
            if (val === config.answer.toLowerCase().trim()) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                renderEntries();
            } else {
                const feedback = document.getElementById('auth-feedback');
                feedback.innerText = "The ink refuses to appear.";
                setTimeout(() => feedback.innerText = "", 2000);
            }
        }

        function renderEntries() {
            const list = document.getElementById('entry-list');
            list.innerHTML = '';

            entries.forEach((entry, index) => {
                const quote = magicQuotes[index % magicQuotes.length];
                const div = document.createElement('div');
                div.className = 'entry-card';
                div.onclick = () => openEdit(index);
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size: 0.8rem;">
                        <span>${entry.date}</span>
                        <span style="color:#700" onclick="event.stopPropagation(); deleteEntry(${index})">✕</span>
                    </div>
                    <div style="font-weight:bold; margin: 10px 0; font-size: 1.2rem;">${entry.title}</div>
                    <div class="quote-text">${quote}</div>
                `;
                list.appendChild(div);
            });
        }

        function addEntry() {
            const date = document.getElementById('new-date').value;
            const title = document.getElementById('new-title').value;
            const body = document.getElementById('new-content').value;
            if(!title || !body) return;

            entries.unshift({ date, title, body });
            saveAndRefresh();
            document.getElementById('new-title').value = '';
            document.getElementById('new-content').value = '';
        }

        // EDIT LOGIC
        function openEdit(index) {
            currentEditIndex = index;
            const entry = entries[index];
            document.getElementById('edit-title').value = entry.title;
            document.getElementById('edit-date').value = entry.date;
            document.getElementById('edit-content').value = entry.body;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function updateEntry() {
            entries[currentEditIndex].title = document.getElementById('edit-title').value;
            entries[currentEditIndex].date = document.getElementById('edit-date').value;
            entries[currentEditIndex].body = document.getElementById('edit-content').value;
            saveAndRefresh();
            closeEdit();
        }

        function closeEdit() {
            document.getElementById('edit-modal').style.display = 'none';
            currentEditIndex = null;
        }

        function deleteEntry(index) {
            if(confirm("Erase this memory?")) {
                entries.splice(index, 1);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('diary_entries', JSON.stringify(entries));
            renderEntries();
        }

        function toggleSettings(show) {
            document.getElementById('settings-menu').style.display = show ? 'block' : 'none';
        }

        function saveSettings() {
            config.riddle = document.getElementById('set-riddle').value || config.riddle;
            config.answer = document.getElementById('set-answer').value || config.answer;
            localStorage.setItem('diary_config', JSON.stringify(config));
            location.reload();
        }

        init();
    </script>
</body>
</html>
